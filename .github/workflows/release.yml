name: Release

# Builds, packages, signs the MSIX, exports the public signing certificate,
# then attaches them to a GitHub Release. Release notes are taken from the
# matching CHANGELOG.md section. Triggered by pushing a vX.Y.Z tag (or manually
# from a tag ref).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msix:
    name: Build and publish MSIX
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: ver
        shell: pwsh
        # refs/tags/v1.2.3 -> 1.2.3
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' is not vX.Y.Z" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore + test (release gate)
        # Exclude the Testcontainers integration tests: the hosted Windows
        # runner has Docker in Windows-container mode, so it cannot pull the
        # Linux SQL Server/PostgreSQL/MySQL images those tests require. They run
        # in a dedicated Docker-enabled job, not the release gate.
        run: |
          dotnet restore .\ExportAzureWiki.sln
          dotnet test .\ExportAzureWiki.sln -c Release --filter "Category!=Integration"

      - name: Decode signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          PUBLISHER: ${{ secrets.SIGNING_PUBLISHER }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) { $missing += 'SIGNING_PFX_BASE64' }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { $missing += 'SIGNING_PFX_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) { $missing += 'SIGNING_PUBLISHER' }

          if ($missing.Count -gt 0) {
            Write-Host "::error::Release MSIX packages must be signed. Missing signing configuration: $($missing -join ', ')."
            exit 1
          }

          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pfx = Join-Path $dir 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          "pfx=$pfx" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Build MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          PUBLISHER: ${{ secrets.SIGNING_PUBLISHER }}
          PUBLISHER_DISPLAY: ${{ vars.SIGNING_PUBLISHER_DISPLAY }}
          APPINSTALLER_URI: ${{ vars.APPINSTALLER_BASE_URI }}
        run: |
          $publisher = $env:PUBLISHER
          $display   = if ([string]::IsNullOrWhiteSpace($env:PUBLISHER_DISPLAY)) { 'ExportAzureWiki' } else { $env:PUBLISHER_DISPLAY }
          $args = @{
            Version              = '${{ steps.ver.outputs.version }}'
            Revision             = ${{ github.run_number }}
            Publisher            = $publisher
            PublisherDisplayName = $display
            PfxPath              = '${{ steps.cert.outputs.pfx }}'
            PfxPassword          = (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          }
          # When an internal feed URL is configured, also emit .appinstaller
          # files so installed apps auto-update from that feed.
          if (-not [string]::IsNullOrWhiteSpace($env:APPINSTALLER_URI)) {
            $args.AppInstallerUri = $env:APPINSTALLER_URI
          }
          # Build both flavors: self-contained (no runtime prerequisite) and
          # framework-dependent (small; needs the .NET 8 Desktop Runtime).
          ./tools/package/Build-Msix.ps1 @args -SelfContained $true
          ./tools/package/Build-Msix.ps1 @args -SelfContained $false

      - name: Upload MSIX as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: msix-${{ steps.ver.outputs.version }}
          path: |
            artifacts/msix/*.msix
            artifacts/msix/*.appinstaller
            artifacts/msix/*.cer
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signingNote = "Signed MSIX. The public signing certificate is attached as ExportAzureWiki-signing.cer; install it on machines that need to trust the package (see docs/operations/PACKAGING.md)."
          # Pull the human-readable notes from CHANGELOG.md (version section, or
          # Unreleased as a fallback) so the release notes track the changelog.
          $changelog = ./tools/release/Get-ChangelogSection.ps1 -Version '${{ steps.ver.outputs.version }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $body = if ([string]::IsNullOrWhiteSpace($changelog)) {
            $signingNote
          } else {
            "$changelog`n`n---`n`n$signingNote"
          }
          Set-Content -LiteralPath $notesPath -Value $body -Encoding utf8
          $assets = Get-ChildItem artifacts/msix/* -Include *.msix,*.appinstaller,*.cer | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' $assets `
            --title '${{ github.ref_name }}' --notes-file $notesPath
